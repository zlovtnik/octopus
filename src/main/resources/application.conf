postgres {
  host = "127.0.0.1"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  database = "sync"
  database = ${?POSTGRES_DATABASE}
  user = "octopus_runtime"
  user = ${?POSTGRES_USER}
  password = ""
  password = ${?POSTGRES_PASSWORD}
  pool-size = 20
  pool-size = ${?POSTGRES_POOL_SIZE}
  healthcheck-reserve = 2
  healthcheck-reserve = ${?POSTGRES_HEALTHCHECK_RESERVE}
  connection-timeout-ms = 5000
  connection-timeout-ms = ${?POSTGRES_CONNECTION_TIMEOUT_MS}
  statement-timeout-secs = 30
  statement-timeout-secs = ${?POSTGRES_STATEMENT_TIMEOUT_SECS}
  enabled = false
  enabled = ${?POSTGRES_ENABLED}
  warn-only = false
  warn-only = ${?POSTGRES_WARN_ONLY}
  ssl-mode = "verify-full"
  ssl-mode = ${?POSTGRES_SSL_MODE}
  ssl-ca-path = ""
  ssl-ca-path = ${?POSTGRES_SSL_CA_PATH}
  ssl-server-name = ""
  ssl-server-name = ${?POSTGRES_SSL_SERVER_NAME}
  ssl-client-key-store-path = ""
  ssl-client-key-store-path = ${?POSTGRES_SSL_CLIENT_KEYSTORE_PATH}
  ssl-client-key-store-password = ""
  ssl-client-key-store-password = ${?POSTGRES_SSL_CLIENT_KEYSTORE_PASSWORD}
  ssl-client-key-store-type = "PKCS12"
  ssl-client-key-store-type = ${?POSTGRES_SSL_CLIENT_KEYSTORE_TYPE}
  local-dev-allow-public-key-retrieval = false
  local-dev-allow-public-key-retrieval = ${?POSTGRES_LOCAL_DEV_ALLOW_PUBLIC_KEY_RETRIEVAL}
  manifest-sha-256 = "aa7b959953e75d287bea35161bbdc47498e577b3e629368773e5569e6e77d57b"
  manifest-sha-256 = ${?POSTGRES_SCHEMA_MANIFEST_SHA256}
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?SYNC_REDPANDA_BOOTSTRAP_SERVERS}
  load-topic = "sync.oracle.load"
  load-topic = ${?SYNC_LOAD_TOPIC}
  result-topic = "sync.oracle.result"
  result-topic = ${?SYNC_RESULT_TOPIC}
  scan-topic = "sync.scan.request"
  scan-topic = ${?COORDINATOR_SCAN_TOPIC}
  scan-topic = ${?SYNC_SCAN_TOPIC}
  payload-audit-topic = "proxy.payload_audit"
  payload-audit-topic = ${?COORDINATOR_PAYLOAD_AUDIT_TOPIC}
  payload-audit-topic = ${?SYNC_PAYLOAD_AUDIT_TOPIC}
  dlq-suffix = ".dlq"
  dlq-suffix = ${?SYNC_DLQ_SUFFIX}
  scan-consumer = "octopus-scan-postgres-v1"
  scan-consumer = ${?COORDINATOR_SCAN_CONSUMER}
  scan-consumer = ${?SYNC_SCAN_CONSUMER}
  result-consumer = "octopus-result-postgres-v1"
  result-consumer = ${?COORDINATOR_RESULT_CONSUMER}
  result-consumer = ${?SYNC_RESULT_CONSUMER}
  payload-audit-consumer = "octopus-payload-audit-postgres-v1"
  payload-audit-consumer = ${?COORDINATOR_PAYLOAD_AUDIT_CONSUMER}
  payload-audit-consumer = ${?SYNC_PAYLOAD_AUDIT_CONSUMER}
  load-consumer = "octopus-load-postgres-v1"
  load-consumer = ${?COORDINATOR_LOAD_CONSUMER}
  load-consumer = ${?SYNC_LOAD_CONSUMER}
  max-poll-records = 500
  max-poll-records = ${?COORDINATOR_MAX_POLL_RECORDS}
  poll-timeout-ms = 3000
  poll-timeout-ms = ${?COORDINATOR_POLL_TIMEOUT_MS}
  locked-batch-size = 500
  locked-batch-size = ${?COORDINATOR_LOCKED_BATCH_SIZE}
  locked-batch-window-ms = 250
  locked-batch-window-ms = ${?COORDINATOR_LOCKED_BATCH_WINDOW_MS}
  topic-partitions = 24
  topic-partitions = ${?SYNC_REDPANDA_TOPIC_PARTITIONS}
  topic-replication-factor = 3
  topic-replication-factor = ${?SYNC_REDPANDA_TOPIC_REPLICATION_FACTOR}
}

cron {
  idle-sleep-ms = 250
  idle-sleep-ms = ${?COORDINATOR_IDLE_SLEEP_MS}
  idle-sleep-backoff-ms = 1000
  idle-sleep-backoff-ms = ${?COORDINATOR_IDLE_SLEEP_BACKOFF_MS}
  dispatch-batch-size = 50
  dispatch-batch-size = ${?COORDINATOR_DISPATCH_BATCH_SIZE}
  ingest-batch-size = 1000
  ingest-batch-size = ${?COORDINATOR_INGEST_BATCH_SIZE}
  scan-max-attempts = 5
  scan-max-attempts = ${?COORDINATOR_SCAN_MAX_ATTEMPTS}
  scan-retry-backoff-seconds = 30
  scan-retry-backoff-seconds = ${?COORDINATOR_SCAN_RETRY_BACKOFF_SECS}
  batch-dispatch-lease-seconds = 300
  batch-dispatch-lease-seconds = ${?COORDINATOR_BATCH_LEASE_SECS}
  batch-dispatch-retry-max-seconds = 300
  batch-dispatch-retry-max-seconds = ${?COORDINATOR_BATCH_RETRY_MAX_SECS}
  batch-max-attempts = 5
  batch-max-attempts = ${?COORDINATOR_BATCH_MAX_ATTEMPTS}
  heartbeat-log-interval-ms = 15000
  heartbeat-log-interval-ms = ${?COORDINATOR_HEARTBEAT_INTERVAL_MS}
  schema-refresh-interval-seconds = 300
  schema-refresh-interval-seconds = ${?SCHEMA_REFRESH_INTERVAL_SECS}
  scan-fetch-count = 500
  scan-fetch-count = ${?COORDINATOR_SCAN_FETCH_COUNT}
  result-fetch-count = 200
  result-fetch-count = ${?COORDINATOR_RESULT_FETCH_COUNT}
}

ingest {
  stream-names = ["proxy.events", "wireless.audit", "audit.wireless.bandwidth",
    "wireless.alert.rogue_ap", "wireless.alert.deauth_flood",
    "wireless.alert.signal_anomaly", "wireless.alert.pmf_attack",
    "wireless.client.inventory", "wireless.probe.flush", "proxy.payload_audit"]
  stream-names = ${?SYNC_STREAM_NAMES}
  stream-names = ${?COORDINATOR_STREAM_NAMES}
  load-stream-names = ["proxy.events", "wireless.audit", "audit.wireless.bandwidth",
    "wireless.alert.rogue_ap", "wireless.alert.deauth_flood",
    "wireless.alert.signal_anomaly", "wireless.alert.pmf_attack",
    "wireless.client.inventory", "wireless.probe.flush", "proxy.payload_audit"]
  load-stream-names = ${?COORDINATOR_LOAD_STREAM_NAMES}
}

backpressure {
  budget-multiplier = 4
  budget-multiplier = ${?COORDINATOR_BACKPRESSURE_BUDGET_MULTIPLIER}
  adaptive-pull-change-threshold = 50
  adaptive-pull-change-threshold = ${?COORDINATOR_ADAPTIVE_PULL_CHANGE_THRESHOLD}
  adaptive-pull-min-restart-interval-ms = 10000
  adaptive-pull-min-restart-interval-ms = ${?COORDINATOR_ADAPTIVE_PULL_MIN_RESTART_INTERVAL_MS}
}

http {
  port = 8081
  port = ${?COORDINATOR_HTTP_PORT}
}

sync {
  outbox-dir = "/var/lib/sync/outbox"
  outbox-dir = ${?SYNC_OUTBOX_DIR}
}

wireless {
  backlog-save-topic = "wireless.backlog.save"
  backlog-save-topic = ${?WIRELESS_BACKLOG_SAVE_TOPIC}
  backlog-save-consumer = "wireless-backlog-save-postgres-v1"
  backlog-save-consumer = ${?WIRELESS_BACKLOG_SAVE_CONSUMER}
  backlog-list-topic = "wireless.backlog.list"
  backlog-list-topic = ${?WIRELESS_BACKLOG_LIST_TOPIC}
  backlog-list-consumer = "wireless-backlog-list-postgres-v1"
  backlog-list-consumer = ${?WIRELESS_BACKLOG_LIST_CONSUMER}
  backlog-list-reply-topic = "wireless.backlog.list.reply"
  backlog-list-reply-topic = ${?WIRELESS_BACKLOG_LIST_REPLY_TOPIC}
  backlog-synced-topic = "wireless.backlog.synced"
  backlog-synced-topic = ${?WIRELESS_BACKLOG_SYNCED_TOPIC}
  backlog-synced-consumer = "wireless-backlog-synced-postgres-v1"
  backlog-synced-consumer = ${?WIRELESS_BACKLOG_SYNCED_CONSUMER}
  backlog-prune-topic = "wireless.backlog.prune"
  backlog-prune-topic = ${?WIRELESS_BACKLOG_PRUNE_TOPIC}
  backlog-prune-consumer = "wireless-backlog-prune-postgres-v1"
  backlog-prune-consumer = ${?WIRELESS_BACKLOG_PRUNE_CONSUMER}
  backlog-prune-reply-topic = "wireless.backlog.prune.reply"
  backlog-prune-reply-topic = ${?WIRELESS_BACKLOG_PRUNE_REPLY_TOPIC}
  mac-lookup-topic = "wireless.mac.lookup"
  mac-lookup-topic = ${?WIRELESS_MAC_LOOKUP_TOPIC}
  mac-lookup-consumer = "wireless-mac-lookup-postgres-v1"
  mac-lookup-consumer = ${?WIRELESS_MAC_LOOKUP_CONSUMER}
  mac-lookup-reply-topic = "wireless.mac.lookup.reply"
  mac-lookup-reply-topic = ${?WIRELESS_MAC_LOOKUP_REPLY_TOPIC}
  networks-authorized-topic = "wireless.networks.authorized"
  networks-authorized-topic = ${?WIRELESS_NETWORKS_AUTHORIZED_TOPIC}
  networks-authorized-consumer = "wireless-networks-authorized-postgres-v1"
  networks-authorized-consumer = ${?WIRELESS_NETWORKS_AUTHORIZED_CONSUMER}
  networks-authorized-reply-topic = "wireless.networks.authorized.reply"
  networks-authorized-reply-topic = ${?WIRELESS_NETWORKS_AUTHORIZED_REPLY_TOPIC}
  probe-flush-topic = "wireless.probe.flush"
  probe-flush-topic = ${?WIRELESS_PROBE_FLUSH_TOPIC}
  probe-flush-consumer = "wireless-probe-flush-postgres-v1"
  probe-flush-consumer = ${?WIRELESS_PROBE_FLUSH_CONSUMER}
  consumers-count = 1
  consumers-count = ${?WIRELESS_CONSUMERS_COUNT}
  max-poll-records = 500
  max-poll-records = ${?WIRELESS_MAX_POLL_RECORDS}
}

# Runtime work is deliberately fail-closed in local defaults. Deployments enable
# the lanes explicitly; Kafka committed offsets provide restart/replay position.
runtime {
  environment = "production"
  environment = ${?OCTOPUS_ENVIRONMENT}
  processors-enabled = false
  processors-enabled = ${?OCTOPUS_PROCESSORS_ENABLED}
  consumers-enabled = false
  consumers-enabled = ${?OCTOPUS_CONSUMERS_ENABLED}
}

processors {
  enabled = []
  enabled = ${?OCTOPUS_ENABLED_PROCESSORS}
  restart-base-delay-ms = 1000
  restart-base-delay-ms = ${?OCTOPUS_PROCESSOR_RESTART_BASE_DELAY_MS}
  restart-max-delay-ms = 30000
  restart-max-delay-ms = ${?OCTOPUS_PROCESSOR_RESTART_MAX_DELAY_MS}
  batch-size = 250
  batch-size = ${?OCTOPUS_PROCESSOR_BATCH_SIZE}
  interval-seconds = 10
  interval-seconds = ${?OCTOPUS_PROCESSOR_INTERVAL_SECONDS}
  embedding-model = "sentence-transformers/all-MiniLM-L6-v2"
  embedding-model = ${?OCTOPUS_EMBEDDING_MODEL}
  event-duplicate-distance = 0.05
  event-duplicate-distance = ${?OCTOPUS_EVENT_DUPLICATE_DISTANCE}
  behavior-similarity-threshold = 0.88
  behavior-similarity-threshold = ${?OCTOPUS_BEHAVIOR_SIMILARITY_THRESHOLD}
  sequence-distance-threshold = 0.10
  sequence-distance-threshold = ${?OCTOPUS_SEQUENCE_DISTANCE_THRESHOLD}
}

archive {
  enabled = false
  enabled = ${?OCTOPUS_ARCHIVE_ENABLED}
  endpoint = "http://minio:9000"
  endpoint = ${?MINIO_ENDPOINT}
  access-key = ""
  access-key = ${?MINIO_ACCESS_KEY_ID}
  secret-key = ""
  secret-key = ${?MINIO_SECRET_ACCESS_KEY}
  bucket = "ssl-proxy-wireless-raw-archive"
  bucket = ${?WIRELESS_RAW_ARCHIVE_BUCKET}
  region = "us-east-1"
  region = ${?MINIO_REGION}
  hot-days = 7
  hot-days = ${?WIRELESS_RAW_PAYLOAD_HOT_DAYS}
  event-retention-days = 30
  event-retention-days = ${?SYNC_EVENT_ROW_RETENTION_DAYS}
  search-retention-days = 30
  search-retention-days = ${?SEARCH_RETENTION_DAYS}
  tombstone-retention-days = 45
  tombstone-retention-days = ${?SYNC_EVENT_TOMBSTONE_RETENTION_DAYS}
  batch-size = 100
  batch-size = ${?WIRELESS_RAW_ARCHIVE_BATCH_SIZE}
  interval-ms = 300000
  interval-ms = ${?WIRELESS_RAW_ARCHIVE_INTERVAL_MS}
  maintenance-interval-ms = 3600000
  maintenance-interval-ms = ${?RETENTION_MAINTENANCE_INTERVAL_MS}
}
